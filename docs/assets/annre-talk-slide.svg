<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#102536"/><g font-family="DejaVu Sans,sans-serif"><text x="90" y="153" fill="#65dfc6" font-size="100" font-weight="bold">AnnRE</text><text x="90" y="228" fill="white" font-size="44">Annotation Refinement with Evidence</text><text x="90" y="296" fill="#acc2d5" font-size="30">Long-read RNA evidence → gene-model review</text><text x="90" y="391" fill="#65dfc6" font-size="27">RESEARCH ALPHA · EVIDENCE FIRST</text><text x="90" y="475" fill="white" font-size="37" font-weight="bold">Audit reference structures</text><text x="90" y="523" fill="#acc2d5" font-size="27">Exact joins, alternative connections and exon contexts</text><text x="90" y="610" fill="white" font-size="37" font-weight="bold">Make candidates inspectable</text><text x="90" y="658" fill="#acc2d5" font-size="27">Read-level evidence, alternate models and offline reports</text><text x="90" y="745" fill="white" font-size="37" font-weight="bold">Track decisions later</text><text x="90" y="793" fill="#acc2d5" font-size="27">Visual curation and reversible edits remain planned</text><rect x="1330" y="352" width="500" height="500" rx="18" fill="white"/><image x="1350" y="372" width="460" height="460" xlink:href="data:image/png;base64,"/><text x="1325" y="899" fill="white" font-size="24">github.com/Andy-B-123/AnnRE</text><text x="90" y="938" fill="#65dfc6" font-size="30">BSF census: 105 genes / 116 joins prioritised for review</text><text x="90" y="980" fill="#acc2d5" font-size="23">Candidates, not confirmed errors. Separate genome-wide census; portable alpha demonstrated on ten genes.</text><text x="90" y="1035" fill="white" font-size="22">Generated with OpenAI Codex and OpenAI models; reviewed and guided by Andreas Bachler.</text></g></svg>