<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><style>text{font-family:DejaVu Sans,sans-serif}.muted{fill:#acc2d5}.body{fill:#dce8f2;font-size:21px}.label{fill:#65dfc6;font-size:17px;letter-spacing:2px}</style><rect width="1440" height="760" rx="24" fill="#102536"/><text x="60" y="70" fill="white" font-size="36" font-weight="bold">From long reads to annotation decisions</text><text x="60" y="108" class="body">AnnRE packages evidence and candidates for review. Automatic editing comes later.</text><rect x="60" y="156" width="410" height="358" rx="16" fill="#1c384b"/><text x="85" y="197" class="label">01  INPUTS</text><text x="85" y="242" fill="white" font-size="25" font-weight="bold">Start with the evidence</text><text x="85" y="292" class="body">Reference GTF + genome</text><text x="85" y="332" class="body">Indexed long-read alignments</text><text x="85" y="372" class="body">Sample / tissue metadata</text><text x="85" y="412" class="body">Optional: Tiberius, Bambu,</text><text x="85" y="452" class="body">ANNEXA and other GTFs</text><rect x="515" y="156" width="410" height="358" rx="16" fill="#1c384b"/><text x="540" y="197" class="label">02  AUDIT</text><text x="540" y="242" fill="white" font-size="25" font-weight="bold">Test the connections</text><text x="540" y="292" class="body">Filter alignments; group reads</text><text x="540" y="332" class="body">Check exact and alternate joins</text><text x="540" y="372" class="body">Find cross-gene connections</text><text x="540" y="412" class="body">Inspect internal-exon context</text><text x="540" y="452" class="body">Compare annotation structures</text><rect x="970" y="156" width="410" height="358" rx="16" fill="#1c384b"/><text x="995" y="197" class="label">03  REVIEW</text><text x="995" y="242" fill="white" font-size="25" font-weight="bold">Make evidence inspectable</text><text x="995" y="292" class="body">Candidate + support tables</text><text x="995" y="332" class="body">Read-level provenance</text><text x="995" y="372" class="body">Sample / tissue summaries</text><text x="995" y="412" class="body">Offline HTML / SVG views</text><text x="995" y="452" class="body">Human adjudication required</text><text x="475" y="345" fill="#65dfc6" font-size="35">→</text><text x="930" y="345" fill="#65dfc6" font-size="35">→</text><rect x="60" y="555" width="1320" height="135" rx="16" fill="none" stroke="#7095ad" stroke-width="2" stroke-dasharray="9 7"/><text x="85" y="595" class="label">LATER · PLANNED, NOT IMPLEMENTED</text><text x="85" y="635" fill="white" font-size="25">Visual curation → recorded decisions → proposed, reversible annotation edits</text><text x="60" y="730" class="muted" font-size="18">Evidence of absence is conditional on expression, coverage and alignment quality.</text></svg>